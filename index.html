<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>几何体塔防</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== 主页 ==================== -->
  <div id="page-home">
    <div class="home-topbar">
      <span class="home-title-sm">几何体塔防</span>
      <span class="home-coins">💰 <span id="home-coins">0</span></span>
    </div>
    <div class="home-actions">
      <button class="home-btn" id="btn-levels">
        <span class="home-btn-icon">📋</span>
        <span class="home-btn-label">关卡选择</span>
      </button>
      <button class="home-btn" id="btn-upgrade">
        <span class="home-btn-icon">⚡</span>
        <span class="home-btn-label">升级塔</span>
      </button>
      <button class="home-btn" id="btn-endless">
        <span class="home-btn-icon">🌍</span>
        <span class="home-btn-label">无尽模式</span>
      </button>
    </div>
  </div>

  <!-- ==================== 关卡选择页 ==================== -->
  <div id="page-levels" class="hidden">
    <div class="subpage-header">
      <button class="back-btn" id="btn-levels-back">← 返回</button>
      <span class="subpage-title">选择关卡</span>
    </div>
    <div id="level-grid" class="level-grid-h"></div>
  </div>

  <!-- ==================== 塔升级页 ==================== -->
  <div id="page-upgrade" class="hidden">
    <div class="subpage-header">
      <button class="back-btn" id="btn-upgrade-back">← 返回</button>
      <span class="subpage-title">升级防御塔</span>
      <span class="subpage-coins">💰 <span id="upgrade-coins">0</span></span>
    </div>
    <div id="upgrade-list" class="upgrade-list"></div>
  </div>

  <!-- ==================== 游戏页 ==================== -->
  <div id="page-game" class="hidden">
    <div id="game-container"></div>

    <!-- 顶部 HUD -->
    <div id="hud" class="hidden">
      <button id="btn-back-home" class="back-btn" title="返回主页">🏠</button>
      <div class="hud-item">
        <span class="hud-label" id="hud-level-name">关卡</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">生命</span>
        <span class="hud-value" id="hud-lives">20</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">金币</span>
        <span class="hud-value gold" id="hud-gold">200</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">波次</span>
        <span class="hud-value" id="hud-wave">0/10</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">得分</span>
        <span class="hud-value" id="hud-score">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">状态</span>
        <span class="hud-value status" id="hud-status">准备</span>
      </div>
    </div>

    <!-- 底部塔选择面板 -->
    <div id="tower-panel" class="hidden"></div>

    <!-- 开始波次按钮 -->
    <button id="btn-start-wave" class="wave-btn hidden">下一波</button>

    <!-- 升级面板 -->
    <div id="upgrade-panel" class="upgrade-panel hidden">
      <div class="upgrade-header">
        <span id="upgrade-name">箭塔</span>
        <span id="upgrade-level">Lv.1</span>
      </div>
      <div id="upgrade-stats" class="upgrade-stats"></div>
      <div class="upgrade-actions">
        <button id="btn-upgrade" class="btn-upgrade">升级 <span id="upgrade-cost">💰60</span></button>
        <button id="btn-sell" class="btn-sell">出售 💰</button>
      </div>
    </div>

    <!-- 游戏结束覆盖层 -->
    <div id="game-overlay" class="game-overlay hidden">
      <div class="overlay-content">
        <h1 id="overlay-title" class="overlay-title">胜利！</h1>
        <p id="overlay-subtitle" class="overlay-subtitle">VICTORY</p>
        <div class="overlay-stats">
          <div class="ostat">
            <span class="ostat-label">得分</span>
            <span class="ostat-value" id="overlay-score">0</span>
          </div>
          <div class="ostat">
            <span class="ostat-label">获得金币</span>
            <span class="ostat-value gold" id="overlay-coins">0</span>
          </div>
        </div>
        <div id="overlay-stars" class="overlay-stars"></div>
        <div class="overlay-buttons">
          <button id="overlay-btn" class="action-btn">重新挑战</button>
          <button id="overlay-next-btn" class="action-btn secondary">下一关</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== 无尽模式页 ==================== -->
  <div id="page-endless" class="hidden">
    <div id="endless-world"></div>
    <!-- HUD -->
    <div id="endless-hud">
      <button class="back-btn" id="btn-endless-back" title="返回主页">🏠</button>
      <div class="endless-hud-item">
        <span class="endless-hud-label">🌙 昼夜</span>
        <span class="endless-hud-value" id="endless-time">☀️ 白天</span>
      </div>
      <div class="endless-hud-item">
        <span class="endless-hud-label">🪵 木材</span>
        <span class="endless-hud-value" id="endless-wood">50</span>
      </div>
      <div class="endless-hud-item">
        <span class="endless-hud-label">🪨 石头</span>
        <span class="endless-hud-value" id="endless-stone">30</span>
      </div>
      <div class="endless-hud-item">
        <span class="endless-hud-label">💰 金币</span>
        <span class="endless-hud-value gold" id="endless-coins">100</span>
      </div>
      <div class="endless-hud-item">
        <span class="endless-hud-label">🌊 天数</span>
        <span class="endless-hud-value" id="endless-day">1</span>
      </div>
      <div class="endless-hud-item">
        <span class="endless-hud-label">💠 基地</span>
        <span class="endless-hud-value" id="endless-hp">100</span>
      </div>
    </div>
    <!-- 底部操作栏 -->
    <div id="endless-panel">
      <button class="endless-panel-btn" data-action="arrow" title="箭塔 💰50">
        <span class="ep-icon">△</span><span class="ep-label">箭塔</span>
      </button>
      <button class="endless-panel-btn" data-action="cannon" title="炮塔 💰100">
        <span class="ep-icon">■</span><span class="ep-label">炮塔</span>
      </button>
      <button class="endless-panel-btn" data-action="ice" title="冰塔 💰75">
        <span class="ep-icon">◆</span><span class="ep-label">冰塔</span>
      </button>
      <button class="endless-panel-btn" data-action="lightning" title="雷塔 💰150">
        <span class="ep-icon">⬢</span><span class="ep-label">雷塔</span>
      </button>
      <button class="endless-panel-btn" data-action="wall" title="围墙 🪵20">
        <span class="ep-icon">▣</span><span class="ep-label">围墙</span>
      </button>
      <button class="endless-panel-btn" data-action="worker" title="工人 🪵25">
        <span class="ep-icon">◈</span><span class="ep-label">工人</span>
      </button>
      <span class="endless-tip">长按工人拖到资源采集 · 右键拖动地图</span>
    </div>

    <!-- 点击实体弹出的信息面板 -->
    <div id="entity-info-panel" class="entity-info hidden">
      <div class="eip-header">
        <span class="eip-icon" id="eip-icon">◈</span>
        <span class="eip-name" id="eip-name">工人</span>
        <button class="eip-close" id="eip-close">✕</button>
      </div>
      <div class="eip-stats" id="eip-stats"></div>
      <div class="eip-actions" id="eip-actions"></div>
    </div>
    <!-- 游戏结束覆盖层 -->
    <div id="endless-overlay" class="game-overlay hidden">
      <div class="overlay-content">
        <h1 class="overlay-title fail">基地陷落</h1>
        <p class="overlay-subtitle">BASE DESTROYED</p>
        <div class="overlay-stats">
          <div class="ostat"><span class="ostat-label">存活天数</span><span class="ostat-value" id="endless-result-days">1</span></div>
          <div class="ostat"><span class="ostat-label">击杀数</span><span class="ostat-value" id="endless-result-kills">0</span></div>
        </div>
        <div class="overlay-buttons">
          <button id="endless-restart-btn" class="action-btn">重新开始</button>
        </div>
      </div>
    </div>
    <!-- 退出确认对话框 -->
    <div id="endless-exit-confirm" class="game-overlay hidden">
      <div class="overlay-content small">
        <h2 class="overlay-title">确认退出？</h2>
        <p class="overlay-subtitle">EXIT &amp; SAVE GAME</p>
        <p style="margin: 24px 0; color: #ccd4d9; font-size: 14px;">退出后将保存当前存档（金币、天数），下次进入无尽模式将重新开始。</p>
        <div class="overlay-buttons">
          <button id="endless-cancel-btn" class="action-btn secondary">取消</button>
          <button id="endless-exit-btn" class="action-btn">退出并保存存档</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Three.js Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
