<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>几何体塔防 - Geometric Tower Defense</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 3D 画布容器 -->
  <div id="game-container"></div>

  <!-- 顶部 HUD -->
  <div id="hud" class="hidden">
    <div class="hud-item">
      <span class="hud-label">生命</span>
      <span class="hud-value" id="hud-lives">20</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">金币</span>
      <span class="hud-value gold" id="hud-gold">200</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">波次</span>
      <span class="hud-value" id="hud-wave">0/10</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">得分</span>
      <span class="hud-value" id="hud-score">0</span>
    </div>
    <div class="hud-item">
      <span class="hud-label">状态</span>
      <span class="hud-value status" id="hud-status">准备</span>
    </div>
  </div>

  <!-- 底部塔选择面板 -->
  <div id="tower-panel" class="hidden"></div>

  <!-- 开始波次按钮 -->
  <button id="btn-start-wave" class="wave-btn hidden">开始下一波</button>

  <!-- 主菜单 -->
  <div id="menu-overlay" class="overlay">
    <div class="overlay-content">
      <h1 class="game-title">几何体塔防</h1>
      <p class="game-subtitle">GEOMETRIC TOWER DEFENSE</p>
      <div class="menu-shapes">
        <div class="menu-shape box"></div>
        <div class="menu-shape cone"></div>
        <div class="menu-shape sphere"></div>
        <div class="menu-shape pyramid"></div>
      </div>
      <p class="game-desc">选择防御塔，放置在网格上，抵御几何体怪物的进攻！</p>
      <button id="btn-start" class="action-btn">开始游戏</button>
      <div class="controls-hint">
        <p>🖱 左键点击格子放置塔 | 🖱 右键取消选择</p>
        <p>🖱 滚轮缩放 | 🖱 右键拖动旋转视角</p>
      </div>
    </div>
  </div>

  <!-- 游戏结束 -->
  <div id="gameover-overlay" class="overlay hidden">
    <div class="overlay-content">
      <h1 class="result-title fail">游戏结束</h1>
      <p class="result-subtitle">GAME OVER</p>
      <div class="result-stats">
        <div class="stat">
          <span class="stat-label">最终得分</span>
          <span class="stat-value" id="gameover-score">0</span>
        </div>
        <div class="stat">
          <span class="stat-label">到达波次</span>
          <span class="stat-value" id="gameover-wave">0</span>
        </div>
      </div>
      <button id="btn-restart" class="action-btn">再来一局</button>
    </div>
  </div>

  <!-- 胜利 -->
  <div id="victory-overlay" class="overlay hidden">
    <div class="overlay-content">
      <h1 class="result-title win">胜利！</h1>
      <p class="result-subtitle">VICTORY</p>
      <div class="result-stats">
        <div class="stat">
          <span class="stat-label">最终得分</span>
          <span class="stat-value" id="victory-score">0</span>
        </div>
      </div>
      <button id="btn-restart2" class="action-btn">再来一局</button>
    </div>
  </div>

  <!-- Three.js Import Map -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="js/main.js"></script>
</body>
</html>
